services:
  lumenlux-frontend:
    container_name: lumenlux-frontend
    build:
      context: .
      dockerfile: Dockerfile
    # image: kenconex/lumenlux-frontend:latest
    env_file:
      - .env
    environment:
      - USER_WEB=${USER_WEB:-admin}
      - USER_PASSWORD=${USER_PASSWORD:-raspberry}
      - SECRET_KEY=${SECRET_KEY:-lumen-zero-super-secret-production-key-998877}
      - OCR_PASSWORD=${OCR_PASSWORD:-illuminati}
      - BECKEND_RPI_IP=${BECKEND_RPI_IP:-192.168.88.22}
      - BECKEND_RPI_PORT=${BECKEND_RPI_PORT:-5000}
      - CLIENT_WATCHDOG_TIMEOUT=${CLIENT_WATCHDOG_TIMEOUT:-15}
      - GO2RTC_HOST=${GO2RTC_HOST:-10.101.27.3:1984}
      - DEFAULT_STREAM_ENGINE=${DEFAULT_STREAM_ENGINE:-webrtc}
      - FRONTEND_PORT=${FRONTEND_PORT:-8080}
      - INACTIVITY_TIME=${INACTIVITY_TIME:-600}
      - EXTRA_ALLOWED_NETWORKS=${EXTRA_ALLOWED_NETWORKS:-10.101.27.0/24,10.101.29.0/24}
      - ANTI_FLICKER=${ANTI_FLICKER:-50}
      - DEFAULT_RESOLUTION=${DEFAULT_RESOLUTION:-1920x1080}
      - DEFAULT_DEVICE_CAM_FIT=${DEFAULT_DEVICE_CAM_FIT:-cover}
      - LED_BRIGHTNESS=${LED_BRIGHTNESS:-35}
      - DEFAULT_LED_COLOR=${DEFAULT_LED_COLOR:-WHITE}
      - LED_AUTO_OFF=${LED_AUTO_OFF:-120}
      - LED_LENGTH=${LED_LENGTH:-100}
      - DATA_DIR=${DATA_DIR:-/app/data}
      - IMAGES_DIR=${IMAGES_DIR:-/app/data/images}
      - PROJECTS_DIR=${PROJECTS_DIR:-/app/data/projects}
      - MODELS_DIR=${MODELS_DIR:-/app/data/models}
      - TESSDATA_DIR=${TESSDATA_DIR:-/app/data/tessdata}
      - OCR_MODEL_VERSION=${OCR_MODEL_VERSION:-v6_small}
      - ONNX_CPU_THREADS=${ONNX_CPU_THREADS:-8}
      - ENABLE_CUSTOM_CNN=${ENABLE_CUSTOM_CNN:-true}
      - TRAIN_DATA_DIR=${TRAIN_DATA_DIR:-/app/data/models/training_data}
      - CUSTOM_MODEL_PATH=${CUSTOM_MODEL_PATH:-/app/data/models/custom_7seg_cnn.pt}
      - TRAIN_CPU_THREADS=${TRAIN_CPU_THREADS:-6}
      - INFERENCE_INTRA_OP_THREADS=${INFERENCE_INTRA_OP_THREADS:-1}
      - TRAIN_EPOCHS=${TRAIN_EPOCHS:-35}
      - TRAIN_BATCH_SIZE=${TRAIN_BATCH_SIZE:-32}
      - TRAIN_LR=${TRAIN_LR:-0.001}
      - TRAIN_VAL_SPLIT=${TRAIN_VAL_SPLIT:-0.20}
      - TRAIN_HOLD_OUT_FRAMES=${TRAIN_HOLD_OUT_FRAMES:-true}
      - TRAIN_AUGMENT_BRIGHTNESS=${TRAIN_AUGMENT_BRIGHTNESS:-0.30}
      - TRAIN_AUGMENT_CONTRAST=${TRAIN_AUGMENT_CONTRAST:-0.35}
      - TRAIN_AUGMENT_SHIFT=${TRAIN_AUGMENT_SHIFT:-0.06}
      - TRAIN_AUGMENT_SHEAR=${TRAIN_AUGMENT_SHEAR:-8.0}
      - TRAIN_AUGMENT_WARP=${TRAIN_AUGMENT_WARP:-0.08}
      - TRAIN_LABEL_SMOOTHING=${TRAIN_LABEL_SMOOTHING:-0.08}
      - TRAIN_EARLY_STOP_PATIENCE=${TRAIN_EARLY_STOP_PATIENCE:-12}
      - TRAIN_USE_SYNTHETIC=${TRAIN_USE_SYNTHETIC:-true}
      - TRAIN_SYNTHETIC_MIX_RATIO=${TRAIN_SYNTHETIC_MIX_RATIO:-0.50}
      - TRAIN_TWO_CHANNEL_CLAHE=${TRAIN_TWO_CHANNEL_CLAHE:-true}
      - TRAIN_ENABLE_FLAT_FIELD=${TRAIN_ENABLE_FLAT_FIELD:-true}
      - TRAIN_ENABLE_GLARE_INPAINT=${TRAIN_ENABLE_GLARE_INPAINT:-true}
      - GLARE_SATURATION_THRESHOLD=${GLARE_SATURATION_THRESHOLD:-250}
      - LAPLACIAN_MIN_VAR=${LAPLACIAN_MIN_VAR:-15.0}
      - MAX_GLARE_RATIO=${MAX_GLARE_RATIO:-0.18}
      - AUTO_LEARN_DECIMALS=${AUTO_LEARN_DECIMALS:-true}
      - CHAMBER_FIXED_DECIMALS=${CHAMBER_FIXED_DECIMALS:-1}
      - STANDARD_FIXED_DECIMALS=${STANDARD_FIXED_DECIMALS:-3}
      - CUSTOM_CNN_CONF_THRESHOLD=${CUSTOM_CNN_CONF_THRESHOLD:-0.88}
      - HARD_EXAMPLE_CONF_THRESHOLD=${HARD_EXAMPLE_CONF_THRESHOLD:-0.90}
      - TTA_SHIFTS=${TTA_SHIFTS:-5}
      - CROSS_CHECK_MAX_DELTA_C=${CROSS_CHECK_MAX_DELTA_C:-2.5}
      - TEMPORAL_MAX_STEP_C=${TEMPORAL_MAX_STEP_C:-5.0}
    ports:
      - 8888:8080         # Web Dashboard & Streaming
    volumes:
      - ./data:/app/data                          # Root data volume (images, models, custom datasets)
      - ./data/images:/app/data/images            # Saved snapshots & capture archives
      - ./data/models:/app/data/models            # Vision & ML models
      - ./data/tessdata:/app/data/tessdata        # Custom Tesseract OCR datasets (optional custom models)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      lumen-net:
        ipv4_address: 10.101.27.2
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      autoheal-this-app: "true"
    restart: unless-stopped

  lumenlux-go2rtc:
    container_name: lumenlux-go2rtc
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    environment:
      - BECKEND_RPI_IP=${BECKEND_RPI_IP:-192.168.88.21}
      - BECKEND_RPI_PORT=${BECKEND_RPI_PORT:-5000}
    ports:
      - "1984:1984/tcp"
      - "8557:8557/tcp"
      - "8557:8557/udp"
    networks:
      lumen-net:
        ipv4_address: 10.101.27.3
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      autoheal-this-app: "true"

networks:
  lumen-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: lumen-net
    ipam:
      driver: default
      config:
        - subnet: 10.101.27.0/24
          gateway: 10.101.27.1
