services:
  lumenlux-frontend:
    container_name: lumenlux-frontend
    build:
      context: .
      dockerfile: Dockerfile
    # image: kenconex/lumenlux-frontend:latest
    env_file:
      - ./.env # Ini .env tetap di dalam dockge
    ports:
      - 8888:8080         # Web Dashboard & Streaming
    volumes:
      - ./data:/app/data                          # Root data volume (images, models, custom datasets)
      - ./data/images:/app/data/images            # Saved snapshots & capture archives
      - ./data/models:/app/data/models            # Vision & ML models
      - ./data/tessdata:/app/data/tessdata        # Custom Tesseract OCR datasets (optional custom models)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      lumen-net:
        ipv4_address: 10.101.27.2
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      autoheal-this-app: "true"
    restart: unless-stopped

  lumenlux-go2rtc:
    container_name: lumenlux-go2rtc
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    environment:
      - BECKEND_RPI_IP=${BECKEND_RPI_IP:-192.168.88.21}
      - BECKEND_RPI_PORT=${BECKEND_RPI_PORT:-5000}
    ports:
      - "1984:1984/tcp"
      - "8557:8557/tcp"
      - "8557:8557/udp"
    networks:
      lumen-net:
        ipv4_address: 10.101.27.3
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      autoheal-this-app: "true"

networks:
  lumen-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: lumen-net
    ipam:
      driver: default
      config:
        - subnet: 10.101.27.0/24
          gateway: 10.101.27.1
