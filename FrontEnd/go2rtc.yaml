# ==============================================================================
# LumenLux-Zero: go2rtc High-Performance H.264 WebRTC & MSE Video Streamer
# ==============================================================================
# Transcodes low-overhead Raspberry Pi MJPEG into camera native resolution (4K 2160p, 2K, 1080p, 720p, etc.) H.264 WebRTC & MSE.
# Reduces streaming bandwidth by ~90% (from 35 Mbps down to ~1.5 - 2.5 Mbps).
# ==============================================================================

log:
  level: "info"

api:
  listen: ":1984"
  origin: "*"

webrtc:
  listen: ":8557"
  candidates:
    - stun:8557

ffmpeg:
  bin: "ffmpeg"

streams:
  chamber:
    - "http://${BECKEND_RPI_IP:192.168.88.21}:${BECKEND_RPI_PORT:5000}/api/camera/stream"
    - "ffmpeg:http://${BECKEND_RPI_IP:192.168.88.21}:${BECKEND_RPI_PORT:5000}/api/camera/stream#video=h264"
    - "ffmpeg:chamber#video=h264"

