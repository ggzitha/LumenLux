<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="33%" stop-color="#00f2fe" />
      <stop offset="66%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="64" height="64" rx="16" fill="#080c14" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Outer RGB Neon Ring (WS2812B Aura) -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#ringGrad)" stroke-width="3.5" filter="url(#neonGlow)" />

  <!-- Camera Body Silhouette -->
  <rect x="20" y="22" width="24" height="19" rx="4" fill="#0d1526" stroke="#00f2fe" stroke-width="1.8" />
  <path d="M26 22 L28 18 L36 18 L38 22 Z" fill="#00f2fe" opacity="0.9" />

  <!-- Camera Aperture / Lens Glow -->
  <circle cx="32" cy="31.5" r="7" fill="#080c14" stroke="url(#glowGrad)" stroke-width="2" />
  <circle cx="32" cy="31.5" r="3.5" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="34" cy="29.5" r="1.2" fill="#ffffff" />

  <!-- Little LED Status Dot -->
  <circle cx="39" cy="25" r="1.5" fill="#10b981" filter="url(#neonGlow)" />
</svg>
